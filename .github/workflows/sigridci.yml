name: sigridci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sigridci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sigrid request assessment
        uses: Software-Improvement-Group/sigridci@main
        with:
          customer: deltares
          system: hatyan
          exclude: /tests/
        env:
          SIGRID_CI_TOKEN: "${{ secrets.SIGRID_CI_TOKEN }}"

      - name: Sigrid publish code
        # not for PRs, so only happens for pushes to the main branch
        if: ${{ github.event_name != 'pull_request'}}
        uses: Software-Improvement-Group/sigridci@main
        with:
          customer: deltares
          system: hatyan
          publishonly: true
          exclude: /tests/
        env:
          SIGRID_CI_TOKEN: "${{ secrets.SIGRID_CI_TOKEN }}"
